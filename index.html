<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
    Pomodoro Method - Productivity Timer App
    Author: Badil Arrohman
    Description: A productivity timer app to help you focus and manage your work sessions efficiently using the Pomodoro Technique.
    Repository: https://github.com/DilFrontendDev/Pomodoro-Timer
  -->
    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Pomodoro Method - A productivity timer app to help you focus and manage your work sessions efficiently using the Pomodoro Technique."
    />
    <meta
      name="keywords"
      content="Pomodoro, Productivity, Timer, Focus, Work, Study, Time Management, Technique, App"
    />
    <meta name="author" content="Badil Arrohman" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Pomodoro" />
    <meta
      property="og:description"
      content="Boost your productivity with the Pomodoro Method timer app. Manage your work and break sessions effectively."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://github.com/DilFrontendDev/Pomodoro-Timer"
    />
    <meta
      property="og:image"
      content="https://PomoLearn.netlify.app/assets/icons/logo.png"
    />

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pomodoro, Pomodoro Method, Countdown" />
    <meta
      name="twitter:description"
      content="Boost your productivity with the Pomodoro Method timer app."
    />
    <meta name="twitter:image" content="https://yourwebsite.com/og-image.png" />

    <!-- Other Meta Tags -->
    <link rel="canonical" href="https://Pomodoro-Learn.netlify.app" />
    <link rel="icon" href="assets/icons/logo.png" type="image/x-icon" />
    <link rel="apple-touch-icon" href="assets/icons/logo.png" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#f8f8f8" />
    <meta name="language" content="en" />
    <meta name="copyright" content="Badil Arrohman" />
    <meta name="distribution" content="global" />
    <meta name="expires" content="never" />
    <meta name="application-name" content="Pomodoro Timer" />
    <meta name="msapplication-TileColor" content="#f8f8f8" />
    <meta name="msapplication-TileImage" content="assets/icons/logo.png" />
    <link
      rel="alternate"
      href="https://github.com/DilFrontendDev/PomoLearn"
      hreflang="en"
    />
    <title>PomoLearn</title>

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="scss/style.css" media="all" />
  </head>
  <body>
    <div class="main-container">
      <!-- =========================
         Navigation Section
    ========================== -->
      <header class="desktop-nav-container">
        <!-- Logo / Web Title -->
        <span class="logo">PomoLearn.</span>
        <nav class="desktop-nav">
          <!-- Repository Button -->
          <a
            href="https://github.com/DilFrontendDev/Pomodoro-Timer"
            target="_blank"
            rel="noopener"
          >
            <button id="repoBtn" class="option">
              <img
                src="assets/icons/github-light.svg"
                alt="GitHub Repository"
              />
              Repository
            </button>
          </a>
        </nav>
      </header>

      <!-- =========================
         Timer Section
    ========================== -->
      <main class="timer-container">
        <!-- Pomodoro Timer Card -->
        <section class="timer-start" aria-labelledby="pomodoro-title">
          <div class="timer-header-container">
            <span class="timer-title" id="pomodoro-title">Pomodoro</span>
            <span class="timer-date" id="timer-date"></span>
          </div>

          <!-- Timer Display -->
          <div class="timer">
            <div class="time" id="time">
              <div class="minute" id="minute">25</div>
              <span>:</span>
              <div class="second" id="second">00</div>
            </div>

            <!-- Timer Controls -->
            <div class="button-container">
              <button id="start">Start</button>
              <button id="stop">Stop</button>
            </div>
          </div>
        </section>

        <!-- Break Session Card -->
        <section class="timer-break" aria-labelledby="break-title">
          <span class="timer-title" id="break-title">Break</span>

          <!-- Timer Display -->
          <div class="time" id="time">
            <div class="minute" id="break-minute">05</div>
            <span>:</span>
            <div class="second" id="break-second">00</div>
          </div>

          <!-- Timer Controls -->
          <div class="button-container">
            <button id="break-startBtn">Start</button>
            <button id="break-stopBtn">Stop</button>
          </div>
        </section>
      </main>

      <!-- ==============
        to do section 
     ================== -->
      <div class="todo-container">
        <!-- header -->
        <header>
          <span class="title">Task</span>
          <button id="addTaskBtn">Add</button>
        </header>

        <!-- input task name -->
        <section class="add-task-container" id="taskName">
          <input
            type="text"
            name=""
            placeholder="Task name"
            class="task-name"
            id="taskNameInput"
            required
          />

          <button id="add">OK</button>
        </section>

        <!-- display task -->
        <table class="display-task" id="displayTask"></table>
      </div>
    </div>

    <!-- =========================
       JavaScript
  ========================== -->
    <script src="script.js"></script>
  </body>
</html>
